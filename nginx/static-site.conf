server {
	listen 80;

	server_name static.local;

	return 301 https://static.local$request_uri;
}

server {
	listen 443 ssl;

	ssl_certificate /etc/nginx/ssl/static.local-new.crt;
	ssl_certificate_key /etc/nginx/ssl/static.local.key;

	server_name static.local;

	root /var/www/static/;

	index index.html;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
	add_header Strict-Transport-Security "max-age=3600" always;	

	location / {
		try_files $uri $uri/ =404;
	}

	location = /style.css {
		expires 1h;
		try_files $uri =404;
	}
}
